services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qkd
      POSTGRES_PASSWORD: qkd
      POSTGRES_DB: qkd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qkd -d qkd"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://qkd:qkd@db:5432/qkd
      # Generate with: python -c "import secrets; print(secrets.token_urlsafe(48))"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your shell or .env file}
      # Comma-separated browser origins allowed to call the API (CORS).
      # Unset -> localhost:5173/4173 defaults.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
