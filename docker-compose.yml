services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qkd
      POSTGRES_PASSWORD: qkd
      POSTGRES_DB: qkd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qkd -d qkd"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://qkd:qkd@db:5432/qkd
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
